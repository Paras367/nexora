<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="apple-mobile-web-app-title" content="Nexora Coffee" />

    
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://images.unsplash.com" />

    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&display=swap" />

      <style>.reveal,.stagger > *{opacity:1 !important;transform:none !important}</style>
    </noscript>

   
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

        "name": "Nexora Coffee",
        "description": "Ethically sourced, sustainably brewed coffee empowering farmers worldwide.",
        "founder": { "@type": "Person", "name": "Paras Dhiman" }

    %sveltekit.head%

  <body data-sveltekit-preload-data="hover" style="background-color: #fdf8f3; color: #2d1b0e; margin: 0;">
    <div style="display: contents">%sveltekit.body%</div>
